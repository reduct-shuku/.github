name: 提交或推荐新的 Skill
description: 提交希望由社区建设的 Skill，或推荐已有的外部 Skill
title: "[Skill 提交] "
labels:
  - submission
body:
  - type: markdown
    attributes:
      value: |
        感谢参与。请说明希望由 Shuku 社区共同建设，还是推荐已有的外部 Skill；不确定的信息请明确标注。

  - type: dropdown
    id: contribution-mode
    attributes:
      label: 提交类型
      options:
        - 参与建设由 Shuku 社区维护的 Skill
        - 推荐外部仓库已有的 Skill
    validations:
      required: true

  - type: input
    id: skill-name
    attributes:
      label: Skill 名称
      placeholder: 例如：intuitive-deep-learning
    validations:
      required: true

  - type: input
    id: source-repository
    attributes:
      label: 代码仓库或计划路径
      description: 已有 Skill 请填写 GitHub 仓库链接；新 Skill 请填写计划存放的 Shuku 仓库或“待确认”。
      placeholder: https://github.com/owner/repository，或“待确认”
    validations:
      required: true

  - type: input
    id: primary-scenario
    attributes:
      label: 主要场景
      description: 说明最适合使用该 Skill 的场景或任务类别。
      placeholder: 例如：用交互式示例学习深度学习基础
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 用途说明
      description: 说明它解决什么问题、适合哪些使用者，以及预期产出。
    validations:
      required: true

  - type: textarea
    id: experience
    attributes:
      label: 实际使用体验
      description: 请描述使用版本、环境、完成的任务、结果和限制；新 Skill 可填写计划验证的实际任务和当前进展。
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: 许可证
      description: 填写仓库声明或计划采用的许可证；未声明或尚未确定时请如实说明。
      placeholder: 例如：MIT、“未声明”或“待确认”
    validations:
      required: true

  - type: textarea
    id: relationship
    attributes:
      label: 提交人与项目的关系
      description: 请披露维护、商业、雇佣、投资、孵化和赞助关系；如均无，请明确填写“无”。
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已说明代码仓库或计划路径，并会遵守 Shuku 的贡献指南和评审政策。
          required: true
