name: Build Agent Skills

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-agent-skills.yml"
      - "registry/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/build-agent-skills.yml"
      - "registry/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:
  repository_dispatch:
    types: [skill-updated]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: agent-skills-registry
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_agent_skills.py --check
      - run: python scripts/validate_agent_skills.py

  refresh:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_agent_skills.py
      - run: python scripts/validate_agent_skills.py
      - name: Commit refreshed registry
        shell: bash
        run: |
          git add registry/agent-skills.json
          if git diff --cached --quiet; then
            echo "Registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh agent skills registry"
          git push
